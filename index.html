<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Interativo</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #1e1e2f 0%, #2a2a4a 50%, #3b2c5c 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      position: relative;
      overflow: hidden;
    }

    /* Bolinhas decorativas ao fundo */
    body::before,
    body::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.5;
      z-index: 0;
    }

    body::before {
      width: 350px;
      height: 350px;
      background: #7f5af0;
      top: -100px;
      left: -100px;
    }

    body::after {
      width: 400px;
      height: 400px;
      background: #2cb67d;
      bottom: -150px;
      right: -150px;
    }

    .quiz-container {
      position: relative;
      z-index: 1;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 35px 30px;
      border-radius: 20px;
      box-shadow:
        0 20px 50px rgba(0, 0, 0, 0.5),
        inset 0 1px 0 rgba(255, 255, 255, 0.1);
      max-width: 520px;
      width: 100%;
      color: #fff;
      animation: fadeIn 0.6s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    h1 {
      text-align: center;
      font-size: 1.8rem;
      margin-bottom: 25px;
      background: linear-gradient(90deg, #7f5af0, #2cb67d);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 1px;
      font-weight: 700;
    }

    .question {
      font-size: 1.15rem;
      font-weight: 600;
      margin-bottom: 20px;
      color: #fffffe;
      padding: 18px 20px;
      background: rgba(127, 90, 240, 0.15);
      border-left: 4px solid #7f5af0;
      border-radius: 10px;
      line-height: 1.5;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .option {
      padding: 14px 18px;
      border: 2px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.25s ease;
      background: rgba(255, 255, 255, 0.05);
      color: #e8e8f0;
      font-size: 1rem;
      position: relative;
      overflow: hidden;
    }

    .option::before {
      content: "";
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(127, 90, 240, 0.2), transparent);
      transition: left 0.5s ease;
    }

    .option:hover::before {
      left: 100%;
    }

    .option:hover {
      background: rgba(127, 90, 240, 0.15);
      border-color: #7f5af0;
      transform: translateX(5px);
      color: #fff;
    }

    .option.correct {
      background: linear-gradient(135deg, #2cb67d, #1f8a5f);
      border-color: #2cb67d;
      color: #fff;
      box-shadow: 0 0 20px rgba(44, 182, 125, 0.5);
    }

    .option.wrong {
      background: linear-gradient(135deg, #e53170, #b91c5b);
      border-color: #e53170;
      color: #fff;
      box-shadow: 0 0 20px rgba(229, 49, 112, 0.5);
    }

    .btn {
      margin-top: 25px;
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #7f5af0, #5a3fc0);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 8px 20px rgba(127, 90, 240, 0.4);
    }

    .btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 12px 25px rgba(127, 90, 240, 0.6);
      background: linear-gradient(135deg, #8a6bff, #6a4ad0);
    }

    .btn:active:not(:disabled) {
      transform: translateY(0);
    }

    .btn:disabled {
      background: rgba(255, 255, 255, 0.1);
      color: rgba(255, 255, 255, 0.4);
      cursor: not-allowed;
      box-shadow: none;
    }

    .result {
      margin-top: 18px;
      text-align: center;
      font-weight: 600;
      font-size: 1.05rem;
      padding: 10px;
      border-radius: 10px;
      min-height: 20px;
      transition: all 0.3s ease;
    }

    /* Responsivo */
    @media (max-width: 480px) {
      .quiz-container { padding: 25px 20px; }
      h1 { font-size: 1.5rem; }
      .question { font-size: 1rem; padding: 14px 16px; }
      .option { padding: 12px 14px; font-size: 0.95rem; }
    }
  </style>
</head>
<body>
  <div class="quiz-container">
    <h1>✨ Quiz Interativo ✨</h1>
    <div class="question" id="question">1. Qual é a capital do Brasil?</div>
    <div class="options" id="options"></div>
    <button class="btn" id="nextBtn" disabled>Próxima Pergunta →</button>
    <div class="result" id="result"></div>
  </div>

  <script>
    const quizData = [
      {
        question: "1. Qual é a capital do Brasil?",
        options: ["São Paulo", "Brasília", "Rio de Janeiro", "Salvador"],
        correct: 1
      },
      {
        question: "2. Qual é o maior planeta do Sistema Solar?",
        options: ["Terra", "Marte", "Júpiter", "Saturno"],
        correct: 2
      },
      {
        question: "3. Quem escreveu 'Dom Casmurro'?",
        options: ["Machado de Assis", "José de Alencar", "Clarice Lispector", "Carlos Drummond"],
        correct: 0
      },
      {
        question: "4. Qual é o elemento químico representado pelo símbolo 'O'?",
        options: ["Ouro", "Oxigênio", "Ósmio", "Ozônio"],
        correct: 1
      },
      {
        question: "5. Em que ano o homem pisou na Lua pela primeira vez?",
        options: ["1965", "1969", "1972", "1975"],
        correct: 1
      }
    ];

    let currentQuestion = 0;
    let selectedOption = null;
    let score = 0;

    const questionEl = document.getElementById("question");
    const optionsEl = document.getElementById("options");
    const nextBtn = document.getElementById("nextBtn");
    const resultEl = document.getElementById("result");

    function loadQuestion() {
      const q = quizData[currentQuestion];
      questionEl.textContent = q.question;
      optionsEl.innerHTML = "";
      selectedOption = null;
      nextBtn.disabled = true;
      resultEl.textContent = "";
      nextBtn.textContent =
        currentQuestion === quizData.length - 1
          ? "Finalizar Quiz ✓"
          : "Próxima Pergunta →";

      q.options.forEach((opt, index) => {
        const div = document.createElement("div");
        div.classList.add("option");
        div.textContent = opt;
        div.addEventListener("click", () => selectOption(index));
        optionsEl.appendChild(div);
      });
    }

    function selectOption(index) {
      if (selectedOption !== null) return;

      selectedOption = index;
      const q = quizData[currentQuestion];
      const optionDivs = document.querySelectorAll(".option");

      optionDivs.forEach((div, i) => {
        if (i === q.correct) {
          div.classList.add("correct");
        } else if (i === index) {
          div.classList.add("wrong");
        }
      });

      if (index === q.correct) {
        resultEl.textContent = "✅ Resposta correta!";
        resultEl.style.color = "#2cb67d";
        resultEl.style.background = "rgba(44, 182, 125, 0.15)";
        score++;
      } else {
        resultEl.textContent = "❌ Resposta incorreta!";
        resultEl.style.color = "#e53170";
        resultEl.style.background = "rgba(229, 49, 112, 0.15)";
      }

      nextBtn.disabled = false;
    }

    nextBtn.addEventListener("click", () => {
      currentQuestion++;
      if (currentQuestion < quizData.length) {
        loadQuestion();
      } else {
        showFinalResult();
      }
    });

    function showFinalResult() {
      const total = quizData.length;
      const percent = Math.round((score / total) * 100);
      let msg = "";

      if (percent === 100) msg = "🏆 Perfeito! Você é um gênio!";
      else if (percent >= 70) msg = "🎉 Muito bem! Excelente desempenho!";
      else if (percent >= 50) msg = "👍 Bom trabalho! Continue assim!";
      else msg = "📚 Continue estudando, você consegue!";

      questionEl.textContent = "🎯 Quiz Concluído!";
      optionsEl.innerHTML = `
        <div style="text-align:center; padding: 15px; background: rgba(127,90,240,0.15); border-radius: 12px;">
          <p style="font-size: 2rem; font-weight: bold; background: linear-gradient(90deg, #7f5af0, #2cb67d); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;">
            ${score} / ${total}
          </p>
          <p style="margin-top: 8px; color: #e8e8f0;">Acertos: ${percent}%</p>
        </div>
      `;
      nextBtn.style.display = "none";
      resultEl.textContent = msg;
      resultEl.style.color = "#7f5af0";
      resultEl.style.background = "rgba(127, 90, 240, 0.15)";
    }

    loadQuestion();
  </script>
</body>
</html>
